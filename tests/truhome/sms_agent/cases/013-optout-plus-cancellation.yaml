id: "013"
title: Opt-out plus cancellation
suite: compliance/terminal-priority
source_ref: "1 / Terminal-priority conflicts / 13"
blocking: true
backends: [A, B]
trigger: inbound
fixture:
  reset: cleartest
turns:
  - send: "Cancel my appointment and stop texting me."
    expect:
      exact: "Understood. You will not receive further texts."
      max_messages: 1
  - send: "But what about my appointment?"
    expect:
      silence: 120
db_expect:
  - {table: contacts, field: opted_in_sms, op: eq, value: false}
notes: "Opt-out outranks the cancellation path; no cancellation instructions may follow."
