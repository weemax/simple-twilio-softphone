id: "097"
title: Successful booking confirms only recorded values
suite: scheduling
source_ref: "11 / 97"
blocking: true
backends: [B]
trigger: inbound
fixture:
  reset: cleartest
  tools:
    appointment_booked:
      mode: success
      returns:
        status: confirmed
        date: "2026-09-08"
        time: "2:00 PM"
        timezone: "America/Chicago"
turns:
  - send: "Tuesday September 8th at 2 PM"
    expect:
      max_messages: 1
      contains: "2:00 PM"
      not_regex: "(?i)\\b(10|6)\\s*(AM|PM)\\b"
      must:
        - "Confirms the date, time, and timezone exactly as returned"
      must_not:
        - "Adds any detail the tool did not return"
