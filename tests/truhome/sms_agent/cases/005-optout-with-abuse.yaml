id: "005"
title: Opt-out combined with abuse
suite: compliance/opt-out
source_ref: "1 / Opt-out and consent / 5"
blocking: true
backends: [A, B]
trigger: inbound
fixture:
  reset: cleartest
turns:
  - send: "Stop texting me, you idiots"
    expect:
      exact: "Understood. You will not receive further texts."
      max_messages: 1
  - send: "Well?"
    expect:
      silence: 120
db_expect:
  - {table: contacts, field: opted_in_sms, op: eq, value: false}
notes: "Opt-out acknowledgment must win over the abuse close of case 109."
