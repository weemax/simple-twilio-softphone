id: "088"
title: Time without a date
suite: scheduling
source_ref: "11 / 88"
blocking: true
backends: [B]
trigger: inbound
fixture:
  reset: cleartest
  tools:
    appointment_booked: {mode: blocked}
turns:
  - send: "2 PM"
    expect:
      max_messages: 1
      tool_not_called: appointment_booked
      not_regex: "(?i)\\b(booked|confirmed|reserved|all set)\\b"
      must:
        - "Requires the offered date"
