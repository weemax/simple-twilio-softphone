id: "014"
title: First outbound, empty record
suite: opening
source_ref: "2 / 14"
blocking: true
backends: [B]
trigger: outbound
fixture:
  reset: cleartest
setup_verify:
  - {table: contacts, field: lead_status, op: ne, value: DNC}
  - {table: contacts, field: opted_in_sms, op: eq, value: true}
turns:
  - expect:
      exact: "Hi, I'm Sarah with TruHome Pros. What exterior project can I help with? Reply STOP to opt out."
      max_messages: 1
notes: |
  The exact string is 97 rendered characters and is GSM-7 clean only if the
  apostrophe is a straight quote. A curly apostrophe fails the global gsm7_only
  check, which is the intended catch.
  Backend A needs an outbound campaign trigger. See COVERAGE.md.
