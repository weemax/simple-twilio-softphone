id: "043"
title: Senior discount request
suite: pricing/finance
source_ref: "5 / 43"
blocking: true
backends: [A, B]
trigger: inbound
fixture:
  reset: cleartest
turns:
  - send: "Do seniors get 20% off?"
    expect:
      max_messages: 1
      no_price: true
      not_regex: "(?i)(\\d+%|discount|save|savings|promo|special offer)"
      must_not:
        - "Claims or denies any discount, savings, or promotion"
