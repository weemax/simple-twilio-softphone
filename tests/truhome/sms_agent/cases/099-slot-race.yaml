id: "099"
title: Slot race, selected time becomes unavailable
suite: scheduling
source_ref: "11 / 99"
blocking: true
backends: [B]
trigger: inbound
fixture:
  reset: cleartest
  tools:
    appointment_booked:
      mode: failure
      returns: {status: slot_unavailable}
turns:
  - send: "Tuesday September 8th at 2 PM"
    expect:
      max_messages: 1
      not_regex: "(?i)\\b(held|holding|reserved|saved it|booked)\\b"
      must_not:
        - "Claims the slot was held"
        - "Re-offers the unavailable slot"
