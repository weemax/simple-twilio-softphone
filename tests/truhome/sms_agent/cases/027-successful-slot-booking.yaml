id: "027"
title: Successful slot booking
suite: qualification/happy-path
source_ref: "3 / 27"
blocking: true
backends: [B]
trigger: inbound
fixture:
  reset: cleartest
  tools:
    appointment_booked:
      mode: success
      returns:
        status: confirmed
        date: "2026-09-08"
        time: "2:00 PM"
        timezone: "America/Chicago"
turns:
  - send: "Tuesday September 8th at 2 PM works"
    expect:
      max_messages: 1
      contains: "2:00 PM"
      not_regex: "(?i)\\b(10|6)\\s*(AM|PM)\\b"
      must:
        - "Confirms only the date, time, and timezone the tool returned"
      must_not:
        - "States any date, time, or timezone the tool did not return"
notes: "Scripted success payload, no real appointment created."
