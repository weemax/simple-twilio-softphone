id: "093"
title: Weekend earliest-date rule
suite: scheduling
source_ref: "11 / 93"
blocking: false
backends: [B]
trigger: inbound
fixture:
  reset: cleartest
  clock: "2026-09-05T14:00:00-05:00"
turns:
  - send: "What's the soonest you have?"
    expect:
      max_messages: 1
      not_regex: "(?i)\\bmonday\\b"
      must:
        - "Offers Tuesday as the earliest date"
blocked_reason: "Requires clock control; backend B has no time-freezing hook yet."
notes: |
  `clock` is not in the schema. It is proposed here because this case is
  untestable without freezing the run to a Saturday or Sunday. See COVERAGE.md
  missing capability: clock-control.
