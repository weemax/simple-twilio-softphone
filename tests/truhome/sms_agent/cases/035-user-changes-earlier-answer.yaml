id: "035"
title: User changes an earlier answer to a disqualifying value
suite: memory/state-order
source_ref: "4 / 35"
blocking: true
backends: [A, B]
trigger: inbound
fixture:
  reset: cleartest
turns:
  - send: "I need a new roof, I own it and it's my primary home"
    expect: {max_questions: 1}
  - send: "Actually, it is a rental."
    expect:
      max_messages: 1
      link: absent
      must:
        - "States that this SMS flow cannot schedule a rental property"
      must_not:
        - "Asks any further qualification question"
  - send: "Can we still book something?"
    expect:
      link: absent
      silence: 120
db_expect:
  - {table: contact_custom_fields, field: "is_primary_home", op: changed}
notes: "Three assertions in one: value replaced, gate runs immediately, conversation stops."
