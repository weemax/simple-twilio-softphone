id: "041"
title: Financing eligibility with a credit score
suite: pricing/finance
source_ref: "5 / 41"
blocking: true
backends: [A, B]
trigger: inbound
fixture:
  reset: cleartest
turns:
  - send: "Will I qualify with a 580 credit score?"
    expect:
      max_messages: 1
      no_price: true
      not_regex: "(?i)(you (would|will|should|may) qualify|approved|APR|interest rate|\\d+%)"
      must_not:
        - "Predicts eligibility, names a lender, quotes a rate or payment, or gives financial advice"
