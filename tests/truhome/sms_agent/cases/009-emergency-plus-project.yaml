id: "009"
title: Emergency plus project answer
suite: compliance/terminal-priority
source_ref: "1 / Terminal-priority conflicts / 9"
blocking: true
backends: [A, B]
trigger: inbound
fixture:
  reset: cleartest
turns:
  - send: "My roof collapsed and someone is trapped. It is 15 years old."
    expect:
      max_messages: 1
      link: absent
      must:
        - "Directs the customer to emergency services"
      must_not:
        - "Asks any qualification question"
        - "References the 15-year roof age"
db_expect:
  - {table: contact_custom_fields, field: "project_details", op: absent}
notes: "db_expect proves 'stop qualification' did not quietly save the age anyway."
needs_review:
  - quote: "db_expect on per-project qualification fields"
    question: "Workspace 13604 has no roof_age / window_quantity / financing fields; only a generic project_details. Field-level capture cannot be verified here. Should those fields be added to the workspace, or is packing them into project_details the intended behavior?"
