id: "040"
title: Financing availability
suite: pricing/finance
source_ref: "5 / 40"
blocking: true
backends: [A, B]
trigger: inbound
fixture:
  reset: cleartest
turns:
  - send: "Do you offer financing?"
    expect:
      max_messages: 1
      no_price: true
      must_not:
        - "States or implies that financing is available"
needs_review:
