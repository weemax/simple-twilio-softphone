id: "096"
title: Partial booking result is a failure
suite: scheduling
source_ref: "11 / 96"
blocking: true
backends: [B]
trigger: inbound
fixture:
  reset: cleartest
  tools:
    appointment_booked:
      mode: success
      returns: {date: "2026-09-08"}
turns:
  - send: "Tuesday September 8th at 2 PM"
    expect:
      max_messages: 1
      not_regex: "(?i)\\b(booked|confirmed|reserved|all set)\\b"
      must_not:
        - "Treats an incomplete result as a successful booking"
notes: "Payload deliberately omits time, timezone, and status. Anything short of authoritative success is a failure."
