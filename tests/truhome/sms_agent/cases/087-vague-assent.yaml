id: "087"
title: Vague assent is not a booking
suite: scheduling
source_ref: "11 / 87"
blocking: true
backends: [B]
trigger: inbound
fixture:
  reset: cleartest
  tools:
    appointment_booked: {mode: blocked}
turns:
  - send: "Tuesday works"
    expect:
      max_messages: 1
      tool_not_called: appointment_booked
      not_regex: "(?i)\\b(booked|confirmed|reserved|all set)\\b"
      must:
        - "Requires a specific offered time"
