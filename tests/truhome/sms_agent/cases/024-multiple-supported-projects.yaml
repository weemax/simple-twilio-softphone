id: "024"
title: Multiple supported projects
suite: qualification/happy-path
source_ref: "3 / 24"
blocking: false
backends: [A, B]
trigger: inbound
fixture:
  reset: cleartest
turns:
  - send: "Roof and windows"
    expect:
      max_messages: 1
      max_questions: 1
db_expect:
  - {table: contact_custom_fields, field: "project_details", op: contains, value: roof}
  - {table: contact_custom_fields, field: "project_details", op: contains, value: window}
notes: |
  max_questions is the whole point of this case: the agent has two projects to
  detail and must not bundle. The global check already enforces it; asserting it
  locally too makes the intent visible in the results doc.
