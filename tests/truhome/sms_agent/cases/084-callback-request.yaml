id: "084"
title: Customer asks for a callback
suite: tool-truth/human-cancellation
source_ref: "10 / 84"
blocking: true
backends: [B]
trigger: inbound
fixture:
  reset: cleartest
  tools:
    request_callback: {mode: failure}
turns:
  - send: "Just have someone call me"
