id: "065"
title: Ambiguous occupancy
suite: eligibility/disqualification
source_ref: "7 / 65"
blocking: true
backends: [A, B]
trigger: inbound
fixture:
  reset: cleartest
turns:
  - send: "It is my other house."
    expect:
      max_messages: 1
      max_questions: 1
      must:
        - "Asks one clarifying question about whether the property is owner-used or rented"
      must_not:
        - "States or implies the property is eligible"
        - "States or implies the property is disqualified"
db_expect:
  - {table: contact_custom_fields, field: "is_primary_home", op: absent}
