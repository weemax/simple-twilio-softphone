id: "091"
title: Weekday slots limited to validated times
suite: scheduling
source_ref: "11 / 91"
blocking: false
backends: [B]
trigger: inbound
fixture:
  reset: cleartest
turns:
  - send: "What do you have on Wednesday?"
    expect:
      max_messages: 1
      not_regex: "(?i)\\b(1|3|4|5|7|8|9|11|12)\\s*(AM|PM)\\b"
      must_not:
        - "Offers any weekday time other than 10 AM, 2 PM, or 6 PM"
needs_review:
  - quote: "only validated 10 AM, 2 PM, or 6 PM slots"
    question: "Must the offered slots also have come back from a host validation call, or is the fixed 10/2/6 set sufficient? The wording says 'validated', which implies a tool result this case does not stub."
